<title>Bestellung anlegen Prototyp</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: Seite „Bestellungen“ im Hintergrund, darüber ein großer Zwei-Spalten-Dialog (Liste | Vorschau + Formular). Farben = Keepit-Tokens. */
:root {
  --bg:#F7F8F7; --surface:#FFFFFF; --surface-2:#F0F4F1; --border:#E0E4E1; --border-strong:#C4CFC8;
  --fg:#111A14; --muted:#4B5C52; --faint:#8A9E93;
  --accent:#00683F; --accent-hover:#005633; --accent-soft:#E6F2EC; --accent-soft-2:#D4EDE1; --on-accent:#FFFFFF;
  --warn:#8A5A00; --warn-soft:#FBF1DC; --info:#1F5F8B; --info-soft:#E3EEF6; --danger:#B03A2E; --danger-soft:#FBE9E7;
  --mark:#FFE9A8; --overlay:rgba(17,26,20,.38); --shadow:0 2px 6px rgba(17,26,20,.08), 0 24px 64px rgba(17,26,20,.18);
  --font:'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0E1310; --surface:#151C17; --surface-2:#1B241E; --border:#27322B; --border-strong:#3A473F;
  --fg:#E4EBE6; --muted:#A3B2A9; --faint:#6D7E74;
  --accent:#3DB27C; --accent-hover:#52C58F; --accent-soft:#132A1E; --accent-soft-2:#1A3828; --on-accent:#05130B;
  --warn:#E2AC52; --warn-soft:#2A2312; --info:#80B6DC; --info-soft:#132331; --danger:#E0786C; --danger-soft:#2E1714;
  --mark:#5A4A12; --overlay:rgba(0,0,0,.6); --shadow:0 2px 6px rgba(0,0,0,.4), 0 24px 64px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"] {
  --bg:#0E1310; --surface:#151C17; --surface-2:#1B241E; --border:#27322B; --border-strong:#3A473F;
  --fg:#E4EBE6; --muted:#A3B2A9; --faint:#6D7E74;
  --accent:#3DB27C; --accent-hover:#52C58F; --accent-soft:#132A1E; --accent-soft-2:#1A3828; --on-accent:#05130B;
  --warn:#E2AC52; --warn-soft:#2A2312; --info:#80B6DC; --info-soft:#132331; --danger:#E0786C; --danger-soft:#2E1714;
  --mark:#5A4A12; --overlay:rgba(0,0,0,.6); --shadow:0 2px 6px rgba(0,0,0,.4), 0 24px 64px rgba(0,0,0,.5); color-scheme:dark;
}
*, *::before, *::after { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
.num { font-variant-numeric:tabular-nums; }
.mono { font-family:var(--mono); font-size:12.5px; letter-spacing:-.01em; }
h1, h2, h3 { margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.01em; }
mark { background:var(--mark); color:inherit; border-radius:2px; padding:0 1px; }

/* Prototyp-Leiste + Hintergrundseite */
.proto { position:relative; z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:8px 16px; background:var(--surface-2); border-bottom:1px dashed var(--border-strong); font-size:12.5px; color:var(--muted); }
.proto .tag { font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--warn); background:var(--warn-soft); padding:2px 8px; border-radius:999px; }
.seg { display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:2px; gap:2px; }
.seg button { border:0; background:none; padding:3px 10px; border-radius:4px; font-size:12.5px; color:var(--muted); white-space:nowrap; }
.seg button[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.page { padding:24px 32px; display:grid; gap:16px; }
.page-head { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
.page-head h1 { font-size:20px; }
.ghostrows { display:grid; gap:8px; }
.ghostrows div { height:56px; background:var(--surface); border:1px solid var(--border); border-radius:8px; }

/* Buttons & Felder */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:38px; padding:0 16px; border-radius:6px; border:1px solid transparent; font-size:14px; font-weight:500; white-space:nowrap; }
.btn.sm { height:32px; padding:0 12px; font-size:13px; }
.btn.primary { background:var(--accent); color:var(--on-accent); }
.btn.primary:hover:not(:disabled) { background:var(--accent-hover); }
.btn.border { background:var(--surface); border-color:var(--border); color:var(--fg); }
.btn.border:hover { background:var(--surface-2); }
.btn.ghost { background:none; color:var(--muted); }
.btn.ghost:hover { background:var(--surface-2); color:var(--fg); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.input { height:38px; padding:0 12px; border:1px solid var(--border); border-radius:6px; background:var(--surface); width:100%; min-width:0; }
.input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
textarea.input { height:auto; padding:8px 12px; min-height:64px; resize:vertical; }
.field { display:grid; gap:5px; min-width:0; }
.field label { font-size:12.5px; font-weight:500; color:var(--muted); }
.field .help { font-size:11.5px; color:var(--faint); }
.prefixed { display:flex; }
.prefixed span { display:flex; align-items:center; padding:0 10px; border:1px solid var(--border); border-right:0; border-radius:6px 0 0 6px; background:var(--surface-2); color:var(--muted); font-family:var(--mono); font-size:12.5px; }
.prefixed .input { border-radius:0 6px 6px 0; }
kbd { font-family:var(--mono); font-size:11px; padding:1px 5px; border:1px solid var(--border-strong); border-bottom-width:2px; border-radius:4px; color:var(--muted); background:var(--surface); }

/* Pills */
.pill { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500; padding:1px 8px; border-radius:999px; white-space:nowrap; }
.pill.warn { background:var(--warn-soft); color:var(--warn); }
.pill.danger { background:var(--danger-soft); color:var(--danger); }
.pill.info { background:var(--info-soft); color:var(--info); }
.pill.neutral { background:var(--surface-2); color:var(--muted); }

/* Dialog */
.overlay { position:fixed; inset:0; background:var(--overlay); z-index:20; display:flex; padding:24px; padding-top:64px; } /* Platz für die Prototyp-Leiste */
.dialog { margin:auto; width:min(1180px, 100%); height:min(820px, 100%); background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; }
.d-head { display:flex; gap:16px; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); }
.d-head .grow { flex:1; min-width:0; display:grid; gap:2px; }
.d-head h2 { font-size:17px; }
.d-head p { margin:0; font-size:12.5px; color:var(--muted); }
.d-body { display:grid; grid-template-columns:minmax(340px, 5fr) minmax(0, 7fr); min-height:0; }
.d-foot { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 20px; border-top:1px solid var(--border); background:var(--surface); }
.d-foot .grow { flex:1; min-width:200px; font-size:12.5px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }

/* Linke Spalte: Suche + Liste */
.pick { border-right:1px solid var(--border); display:grid; grid-template-rows:auto minmax(0,1fr); min-height:0; background:var(--surface); }
.pick-tools { padding:14px 16px 10px; display:grid; gap:10px; border-bottom:1px solid var(--border); }
.searchwrap { position:relative; }
.searchwrap svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint); }
.searchwrap .input { padding-left:34px; padding-right:40px; height:42px; font-size:14.5px; }
.searchwrap kbd { position:absolute; right:10px; top:50%; transform:translateY(-50%); }
.filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.scope { display:flex; align-items:center; gap:10px; padding:9px 10px 9px 12px; border-radius:8px; background:var(--accent-soft); border:1px solid var(--accent-soft-2); flex-wrap:wrap; }
.scope.all { background:var(--surface-2); border-color:var(--border); }
.scope .av { width:30px; height:30px; flex-shrink:0; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-size:11.5px; font-weight:600; letter-spacing:.02em; }
.scope.all .av { background:var(--surface); color:var(--muted); border:1px solid var(--border); }
.scope .grow { flex:1; min-width:140px; display:grid; gap:0; }
.scope .k { font-size:11px; color:var(--muted); }
.scope .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.scope select { height:30px; border:1px solid var(--border); border-radius:6px; background:var(--surface); padding:0 8px; font-size:13px; max-width:100%; }
.chip { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 6px 0 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:12.5px; font-weight:500; border:0; }
.chip button { border:0; background:none; color:inherit; display:flex; padding:2px; border-radius:50%; }
.select { height:28px; border:1px solid var(--border); border-radius:6px; background:var(--surface); font-size:12.5px; padding:0 6px; color:var(--muted); }
.resultinfo { font-size:12px; color:var(--faint); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.list { overflow-y:auto; padding:6px 8px 12px; }
.group { font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:12px 10px 4px; display:flex; justify-content:space-between; }
.group button { border:0; background:none; color:var(--accent); font-size:11px; font-weight:500; letter-spacing:0; text-transform:none; padding:0; }
.row { width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; text-align:left; padding:10px 12px; border-radius:8px; border:1px solid transparent; background:none; }
.row:hover { background:var(--surface-2); }
.row[aria-selected="true"] { background:var(--accent-soft); border-color:var(--accent); }
.row .l1 { display:flex; gap:8px; align-items:baseline; min-width:0; flex-wrap:wrap; }
.row .cust { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.row .amt { font-weight:600; text-align:right; }
.row .l2 { grid-column:1 / -1; display:flex; gap:6px 10px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--muted); }
.row .prods { grid-column:1 / -1; font-size:12px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.empty { padding:32px 16px; text-align:center; color:var(--muted); display:grid; gap:8px; justify-items:center; }
.hintbox { margin:8px 4px; padding:10px 12px; border-radius:8px; background:var(--info-soft); color:var(--info); font-size:12.5px; display:grid; gap:4px; }

/* Rechte Spalte: Vorschau + Formular */
.detail { overflow-y:auto; background:var(--bg); padding:18px 22px 24px; display:grid; gap:18px; align-content:start; min-width:0; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; }
.card-head { padding:14px 16px 10px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:flex-start; }
.card-head .grow { flex:1; min-width:200px; display:grid; gap:3px; }
.card-head h3 { font-size:16px; }
.kv { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px 18px; padding:4px 16px 14px; margin:0; }
.kv div { display:grid; gap:1px; min-width:0; }
.kv dt { font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); }
.kv dd { margin:0; font-size:13.5px; overflow-wrap:anywhere; }
.tablewrap { overflow-x:auto; border-top:1px solid var(--border); }
table { border-collapse:collapse; width:100%; min-width:460px; font-size:13px; }
th { text-align:left; font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); padding:8px 16px; background:var(--surface-2); }
td { padding:8px 16px; border-top:1px solid var(--border); }
td.r, th.r { text-align:right; }
tfoot td { font-weight:600; }
.lockedline { display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--muted); padding:10px 16px; border-top:1px solid var(--border); background:var(--surface-2); border-radius:0 0 10px 10px; }
.sectionh { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:-8px; }
.formgrid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px 16px; padding:16px; }
.formgrid .full { grid-column:1 / -1; }
.warnbox { padding:10px 12px; border-radius:8px; background:var(--warn-soft); color:var(--warn); font-size:12.5px; display:flex; gap:10px; align-items:flex-start; }
.warnbox label { display:flex; gap:8px; align-items:center; font-weight:500; margin-top:6px; }
.placeholder { border:1.5px dashed var(--border-strong); border-radius:10px; padding:48px 24px; text-align:center; color:var(--muted); display:grid; gap:10px; justify-items:center; }
.placeholder .keys { display:flex; gap:6px; align-items:center; font-size:12.5px; color:var(--faint); flex-wrap:wrap; justify-content:center; }
.success { margin:auto; max-width:440px; text-align:center; display:grid; gap:12px; justify-items:center; padding:40px 20px; }
.success .ok { width:48px; height:48px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; }
.back { display:none; }

@media (max-width: 860px) {
  .overlay { padding:0; }
  .dialog { width:100%; height:100%; border-radius:0; border:0; }
  .d-head { padding-top:calc(16px + env(safe-area-inset-top, 0px)); }
  .d-foot { padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px)); }
  .d-body { grid-template-columns:1fr; }
  .d-body.has-sel .pick { display:none; }
  .d-body:not(.has-sel) .detail { display:none; }
  .pick { border-right:0; }
  .back { display:inline-flex; }
  .formgrid { grid-template-columns:1fr; }
  .page { padding:20px 16px; }
  .detail { padding:16px; }
}
</style>

<script type="text/babel" data-presets="react">

  d365:{ name:"Keepit für Dynamics 365", unit:"Nutzer", alias:"d365 crm" }, pbi:{ name:"Keepit für Power BI", unit:"Workspaces", alias:"pbi" },

const o = (quoteId, customer, contact, date, validUntil, supplier, contract, months, positions, extra = {}) =>
  ({ id:quoteId, quoteId, customer, contact, date, validUntil, supplier, contract, months, positions, createdBy:"Oskar Sammet", ...extra });

const OFFERS = [
  o("2026-0147", "Brandt Logistik GmbH", "Julia Brandt", "2026-09-30", "2026-10-30", "keepit", "Keepit Rahmenvertrag 2026", 36, [["m365", 250, 2.90], ["entra", 250, 0.60]]),
  o("2026-0146", "Stadtwerke Kelheim", "Markus Feil", "2026-09-29", "2026-10-29", "nordwind", "Öffentlicher Sektor", 24, [["d365", 60, 3.20]]),

  o("2026-0142", "Brandt Logistik GmbH", "Julia Brandt", "2026-09-24", "2026-10-24", "keepit", "Keepit Rahmenvertrag 2026", 36, [["m365", 200, 2.90]], { supersededBy:"2026-0147" }),

  o("2026-0137", "Klinikum Rosenheim gGmbH", "Dr. Stefan Albers", "2026-09-17", "2026-11-17", "nordwind", "Öffentlicher Sektor", 36, [["m365", 1800, 2.35], ["entra", 1800, 0.45], ["pbi", 25, 6.00]]),
  o("2026-0133", "Klinikum Rosenheim gGmbH", "Dr. Stefan Albers", "2026-09-10", "2026-10-10", "nordwind", "Öffentlicher Sektor", 12, [["sf", 40, 4.50]], { derivation:"LICENSE_EXTENSION", from:"2025-0402" }),
  o("2026-0128", "Weber Druck & Medien GmbH", "Tobias Weber", "2026-09-02", "2026-10-02", "keepit", "Standardvertrag", 12, [["gws", 75, 2.40]]),
  o("2026-0121", "Stadtwerke Kelheim", "Markus Feil", "2026-08-25", "2026-09-24", "nordwind", "Öffentlicher Sektor", 24, [["m365", 310, 2.60]]),
  o("2026-0115", "Hofmann Steuerberatung", "Lena Hofmann", "2026-08-12", "2026-09-11", "keepit", "Standardvertrag", 12, [["gws", 12, 2.60]]),
  o("2026-0109", "Brandt Logistik GmbH", "Thomas Kühn", "2026-07-30", null, "keepit", "Keepit Rahmenvertrag 2026", 12, [["sf", 25, 4.50]]),
  o("2026-0102", "Weber Druck & Medien GmbH", "Tobias Weber", "2026-07-21", "2026-08-20", "keepit", "Standardvertrag", 12, [["m365", 60, 2.90]]),
].map(x => ({ ...x, positions:x.positions.map(([k, qty, price]) => ({ ...P[k], qty, price })) }));

// Bereits angenommen — erscheinen nicht in der Liste, aber als Hinweis bei exakter Suche
const ACCEPTED = [{ quoteId:"2026-0088", customer:"Brandt Logistik GmbH", order:"BE-2026-0027", at:"18.07.2026" }];
const NEXT_ORDER_NO = "2026-0034";

const eur = new Intl.NumberFormat("de-DE", { style:"currency", currency:"EUR" });
const fmt = iso => iso ? iso.split("-").reverse().join(".") : "–";
const monthly = x => x.positions.reduce((a, p) => a + p.qty * p.price, 0);
const daysLeft = x => x.validUntil ? Math.round((new Date(x.validUntil) - TODAY) / 864e5) : null;
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const haystack = x => norm([x.quoteId, "AG" + x.quoteId, x.customer, x.contact, x.contract, SUP[x.supplier], ...x.positions.map(p => p.name + " " + p.alias)].join(" "));

function validity(x) {
  const d = daysLeft(x);
  if (d === null) return { cls:"neutral", text:"ohne Gültigkeit" };
  if (d < 0) return { cls:"danger", text:`abgelaufen ${fmt(x.validUntil)}` };
  if (d <= 7) return { cls:"warn", text: d === 0 ? "läuft heute ab" : `noch ${d} ${d === 1 ? "Tag" : "Tage"}` };
  return null;
}

// Treffer hervorheben (alle Suchbegriffe)
function Hl({ text, terms }) {
  if (!terms.length) return text;
  const re = new RegExp("(" + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "ig");
  return text.split(re).map((part, i) => i % 2 ? <mark key={i}>{part}</mark> : part);
}

// ── Icons ───────────────────────────────────────────────────────────────────
const svg = (d, s=14) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{d}</svg>;
const I = {
  search: svg(<><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>, 16),
  x: svg(<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>, 12),
  close: svg(<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>, 18),
  plus: svg(<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>),
  lock: svg(<><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>, 13),
  file: svg(<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></>),
  check: svg(<polyline points="20 6 9 17 4 12"/>, 22),
  back: svg(<><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>),
  alert: svg(<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>, 16),
};

// ── Kundenanzeige: zeigt den Kundenfilter und erlaubt, ihn zu lösen oder zu setzen ──
const CUSTOMERS = [...new Set(OFFERS.map(x => x.customer))].sort((a, b) => a.localeCompare(b));
const initials = n => n.split(/\s+/).filter(w => /^[A-ZÄÖÜ]/.test(w)).slice(0, 2).map(w => w[0]).join("");

function CustomerScope({ customer, setCustomer, preset }) {
  const count = c => OFFERS.filter(x => x.customer === c && !(daysLeft(x) !== null && daysLeft(x) < 0)).length;
  if (customer) return (
    <div className="scope" role="status">
      <span className="av" aria-hidden="true">{initials(customer)}</span>
      <span className="grow"><span className="k">Nur Angebote von</span><span className="name">{customer}</span></span>
      <button className="btn border sm" onClick={() => setCustomer(null)}>Alle Kunden anzeigen</button>
    </div>
  );
  return (
    <div className="scope all">
      <span className="av" aria-hidden="true">{svg(<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>)}</span>
      <span className="grow"><span className="k">Angebote von</span>
        <select id="scope-customer" aria-label="Kunde wählen" value="" onChange={e => e.target.value && setCustomer(e.target.value)}>
          <option value="">Allen Kunden</option>
          {CUSTOMERS.map(c => <option key={c} value={c}>{c} ({count(c)})</option>)}
        </select>
      </span>
      {preset && <button className="btn ghost sm" onClick={() => setCustomer(preset)}>Zurück zu {preset}</button>}
    </div>
  );
}

// ── Linke Spalte ────────────────────────────────────────────────────────────
function OfferPicker({ q, setQ, customer, setCustomer, preset, otherMatches, scope, setScope, sort, setSort, results, hidden, selectedId, onSelect, onConfirm, searchRef }) {
  const terms = q.trim().split(/\s+/).filter(Boolean);
  const listRef = useRef(null);
  const grouped = !customer && sort === "customer";
  // Nummernsuche („0088“, „AG 2026-0088“) nach bereits angenommenem Angebot → erklären statt leerer Liste
  const qNo = norm(q).replace(/^ag\s*/, "").trim();
  const exactAccepted = qNo.length >= 3 && /^[\d-]+$/.test(qNo) ? ACCEPTED.find(a => a.quoteId.endsWith(qNo)) : null;

  const onKey = e => {
    if (!results.length) return;
    const i = results.findIndex(r => r.id === selectedId);
    if (e.key === "ArrowDown") { e.preventDefault(); onSelect(results[Math.min(i + 1, results.length - 1)].id); }
    if (e.key === "ArrowUp") { e.preventDefault(); onSelect(results[Math.max(i - 1, 0)].id); }
    if (e.key === "Enter" && selectedId) { e.preventDefault(); onConfirm(); }
  };
  useEffect(() => {
    const el = listRef.current?.querySelector('[aria-selected="true"]');
    el?.scrollIntoView({ block:"nearest" });
  }, [selectedId]);

  let lastCustomer = null;
  return (
    <section className="pick" aria-label="Angebot auswählen">
      <div className="pick-tools">
        <CustomerScope customer={customer} setCustomer={setCustomer} preset={preset} />
        <div className="searchwrap">
          {I.search}
          <input ref={searchRef} id="offer-search" className="input" value={q} onChange={e => setQ(e.target.value)} onKeyDown={onKey}
            placeholder={customer ? "Angebotsnr., Ansprechpartner, Produkt…" : "Angebotsnr., Kunde, Ansprechpartner, Produkt…"} aria-controls="offer-list" autoComplete="off" />
          <kbd>/</kbd>
        </div>
        <div className="filters">
          <span className="seg" role="group" aria-label="Gültigkeit">
            <button aria-pressed={scope === "valid"} onClick={() => setScope("valid")}>Gültige</button>
            <button aria-pressed={scope === "all"} onClick={() => setScope("all")}>Alle offenen</button>
          </span>
          <select id="offer-sort" className="select" value={sort} onChange={e => setSort(e.target.value)} aria-label="Sortierung">
            <option value="newest">Neueste zuerst</option>
            <option value="customer">Nach Kunde gruppiert</option>
            <option value="expiring">Läuft bald ab</option>
            <option value="amount">Höchster Betrag</option>
          </select>
        </div>
        <div className="resultinfo">
          <span className="num">{results.length} {results.length === 1 ? "Angebot" : "Angebote"}{hidden > 0 && ` · ${hidden} abgelaufene ausgeblendet`}</span>
          <span><kbd>↑</kbd> <kbd>↓</kbd> wählen · <kbd>Enter</kbd> weiter</span>
        </div>
      </div>
      <div className="list" id="offer-list" role="listbox" aria-label="Offene Angebote" ref={listRef}>
        {exactAccepted && (
          <div className="hintbox">
            <strong>AG {exactAccepted.quoteId} ist bereits angenommen.</strong>
            <span>Am {exactAccepted.at} wurde daraus {exactAccepted.order} ({exactAccepted.customer}).</span>
          </div>
        )}
        {results.map(x => {
          const head = grouped && x.customer !== lastCustomer;
          lastCustomer = x.customer;
          const v = validity(x);
          return (
            <React.Fragment key={x.id}>
              {head && <div className="group"><span>{x.customer}</span><button onClick={() => setCustomer(x.customer)}>nur diesen Kunden</button></div>}
              <button className="row" role="option" aria-selected={x.id === selectedId} onClick={() => onSelect(x.id)} onDoubleClick={onConfirm}>
                <span className="l1">
                  <span className="mono" style={{ color:"var(--faint)" }}>AG <Hl text={x.quoteId} terms={terms} /></span>
                  {!grouped && !customer && <span className="cust"><Hl text={x.customer} terms={terms} /></span>}
                </span>
                <span className="amt num">{eur.format(monthly(x))}<span style={{ fontWeight:400, color:"var(--faint)", fontSize:11.5 }}> /Mon.</span></span>
                <span className="l2">
                  <span><Hl text={x.contact} terms={terms} /></span>
                  <span>vom {fmt(x.date)}</span>
                  {v && <span className={"pill " + v.cls}>{v.text}</span>}
                  {x.derivation === "RENEWAL" && <span className="pill info">Verlängerung</span>}
                  {x.derivation === "LICENSE_EXTENSION" && <span className="pill info">Lizenzerweiterung</span>}
                  {x.supersededBy && <span className="pill neutral">neuere Version: AG {x.supersededBy}</span>}
                </span>
                <span className="prods"><Hl text={x.positions.map(p => `${p.qty} × ${p.name.replace("Keepit für ", "")}`).join(" · ")} terms={terms} /></span>
              </button>
            </React.Fragment>
          );
        })}
        {customer && q && results.length > 0 && otherMatches > 0 && (
          <div className="resultinfo" style={{ padding:"10px 12px" }}>
            <span>{otherMatches} weitere Treffer bei anderen Kunden</span>
            <button className="btn ghost sm" style={{ height:24 }} onClick={() => setCustomer(null)}>Anzeigen</button>
          </div>
        )}
        {results.length === 0 && !exactAccepted && (
          <div className="empty">
            <strong>Kein offenes Angebot gefunden</strong>
            <span style={{ fontSize:13 }}>{customer ? `Für ${customer} passt nichts zu „${q}“.` : `Nichts passt zu „${q}“.`}</span>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap", justifyContent:"center" }}>
              {scope === "valid" && hidden > 0 && <button className="btn border sm" onClick={() => setScope("all")}>Abgelaufene einbeziehen ({hidden})</button>}
              {customer && <button className="btn border sm" onClick={() => setCustomer(null)}>Bei allen Kunden suchen{otherMatches > 0 && ` (${otherMatches} Treffer)`}</button>}
              {q && <button className="btn ghost sm" onClick={() => setQ("")}>Suche leeren</button>}
            </div>
          </div>
        )}
      </div>
    </section>
  );
}

// ── Rechte Spalte ───────────────────────────────────────────────────────────
function OfferDetail({ x, form, setForm, ack, setAck, onBack, firstFieldRef }) {
  const v = validity(x);
  const expired = daysLeft(x) !== null && daysLeft(x) < 0;
  const m = monthly(x);
  const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));
  return (
    <section className="detail" aria-label="Angebot und Bestelldaten">
      <button className="btn ghost sm back" onClick={onBack} style={{ justifySelf:"start" }}>{I.back} Andere Angebote</button>

      {x.supersededBy && <div className="warnbox">{I.alert}<span>Für diesen Kunden gibt es eine neuere Version: <strong>AG {x.supersededBy}</strong>. Prüfe, welches Angebot der Kunde angenommen hat.</span></div>}
      {expired && (
        <div className="warnbox">{I.alert}<div>
          <span>Das Angebot ist seit {fmt(x.validUntil)} abgelaufen. Preise und Konditionen gelten nur, wenn der Kunde trotzdem zu diesen Bedingungen bestellt hat.</span>
          <label><input id="ack-expired" type="checkbox" checked={ack} onChange={e => setAck(e.target.checked)} /> Kunde hat zu diesen Konditionen bestellt</label>
        </div></div>
      )}

      <div className="sectionh">Angebot</div>
      <article className="card">
        <div className="card-head">
          <div className="grow">
            <span className="mono" style={{ color:"var(--faint)" }}>AG {x.quoteId}</span>
            <h3>{x.customer}</h3>
            <span style={{ fontSize:13, color:"var(--muted)" }}>{x.contact}</span>
          </div>
          <div style={{ textAlign:"right", display:"grid", gap:1 }} className="num">
            <strong style={{ fontSize:16 }}>{eur.format(m)} <span style={{ fontWeight:400, fontSize:12, color:"var(--muted)" }}>/ Monat</span></strong>
            <span style={{ fontSize:12, color:"var(--muted)" }}>{eur.format(m * x.months)} über {x.months} Monate, netto</span>
          </div>
        </div>
        <dl className="kv">
          <div><dt>Angebot vom</dt><dd>{fmt(x.date)}</dd></div>
          <div><dt>Gültig bis</dt><dd>{fmt(x.validUntil)} {v && <span className={"pill " + v.cls}>{v.text}</span>}</dd></div>
          <div><dt>Lieferant</dt><dd>{SUP[x.supplier]}</dd></div>
          <div><dt>Vertrag · Laufzeit</dt><dd>{x.contract} · {x.months} Mon.</dd></div>
          {x.from && <div><dt>Abgeleitet von</dt><dd className="mono">AG {x.from}</dd></div>}
          <div><dt>Erstellt von</dt><dd>{x.createdBy}</dd></div>
        </dl>
        <div className="tablewrap">
          <table>
            <thead><tr><th>Produkt</th><th className="r">Menge</th><th className="r">Preis / Einheit</th><th className="r">Monat</th></tr></thead>
            <tbody>{x.positions.map((p, i) => <tr key={i}><td>{p.name}</td><td className="r num">{p.qty.toLocaleString("de-DE")} {p.unit}</td><td className="r num">{eur.format(p.price)}</td><td className="r num">{eur.format(p.qty * p.price)}</td></tr>)}</tbody>
            <tfoot><tr><td>Summe netto</td><td></td><td></td><td className="r num">{eur.format(m)}</td></tr></tfoot>
          </table>
        </div>
        <div className="lockedline">{I.lock}<span style={{ flex:1 }}>Konditionen kommen fest aus dem Angebot. Nach dem Anlegen ist das Angebot gesperrt.</span><button className="btn ghost sm">{I.file} PDF ansehen</button></div>
      </article>

      <div className="sectionh">Bestelldaten</div>
      <div className="card formgrid">
        <div className="field">
          <label htmlFor="f-no">Bestellnummer</label>
          <div className="prefixed"><span>BE</span><input ref={firstFieldRef} id="f-no" className="input mono" value={form.no} onChange={set("no")} /></div>
          <span className="help">Vorschlag: nächste freie Nummer</span>
        </div>
        <div className="field">
          <label htmlFor="f-date">Bestelldatum</label>
          <input id="f-date" type="date" className="input" value={form.date} onChange={set("date")} />
          <span className="help">Tag, an dem der Kunde bestellt hat</span>
        </div>
        <div className="field">
          <label htmlFor="f-proj">Projektnummer des Kunden</label>
          <input id="f-proj" className="input" placeholder="optional, z. B. aus der Bestellmail" value={form.proj} onChange={set("proj")} />
        </div>
        <div className="field">
          <label htmlFor="f-desc">Projektbeschreibung</label>
          <input id="f-desc" className="input" placeholder="optional" value={form.desc} onChange={set("desc")} />
        </div>
        <div className="field full">
          <label htmlFor="f-details">Bestelldetails</label>
          <textarea id="f-details" className="input" placeholder="optional, erscheint auf der Bestellung" value={form.details} onChange={set("details")} />
        </div>
      </div>
    </section>
  );
}

// ── Dialog ──────────────────────────────────────────────────────────────────
function CreateOrderDialog({ presetCustomer, onClose }) {
  const [q, setQ] = useState("");
  const [customer, setCustomer] = useState(presetCustomer);
  const [scope, setScope] = useState("valid");
  const [sort, setSort] = useState("newest");
  const [selectedId, setSelectedId] = useState(null);
  const [form, setForm] = useState({ no:NEXT_ORDER_NO, date:"2026-10-01", proj:"", desc:"", details:"" });
  const [ack, setAck] = useState(false);
  const [done, setDone] = useState(null);
  const searchRef = useRef(null), firstFieldRef = useRef(null);

  const terms = norm(q).split(/\s+/).filter(Boolean);
  const base = OFFERS.filter(x => (!customer || x.customer === customer) && terms.every(t => haystack(x).includes(t)));
  const isExpired = x => daysLeft(x) !== null && daysLeft(x) < 0;
  const results = useMemo(() => {
    const r = base.filter(x => scope === "all" || !isExpired(x));
    const by = {
      newest:(a, b) => b.date.localeCompare(a.date),
      customer:(a, b) => a.customer.localeCompare(b.customer) || b.date.localeCompare(a.date),
      expiring:(a, b) => (daysLeft(a) ?? 9999) - (daysLeft(b) ?? 9999),
      amount:(a, b) => monthly(b) - monthly(a),
    }[sort];
    return [...r].sort(by);
  }, [q, customer, scope, sort]);
  const hidden = scope === "valid" ? base.filter(isExpired).length : 0;
  const otherMatches = customer ? OFFERS.filter(x => x.customer !== customer && terms.every(t => haystack(x).includes(t)) && (scope === "all" || !isExpired(x))).length : 0;

  // Genau ein Treffer → direkt auswählen
  useEffect(() => { if (results.length === 1) setSelectedId(results[0].id); }, [results.length === 1 && results[0].id]);
  useEffect(() => { setAck(false); }, [selectedId]);
  useEffect(() => {
    const k = e => {
      if (e.key === "Escape") onClose();
      if (e.key === "/" && document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA") { e.preventDefault(); searchRef.current?.focus(); }
    };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, []);
  useEffect(() => { searchRef.current?.focus(); }, []);

  const sel = OFFERS.find(x => x.id === selectedId);
  const blocked = !sel || !form.no.trim() || (isExpired(sel) && !ack);

  return (
    <div className="overlay" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
        <header className="d-head">
          <div className="grow">
            <h2 id="dlg-title">Bestellung anlegen</h2>
            <p>{done ? "Fertig" : sel ? `Aus Angebot AG ${sel.quoteId} · ${sel.customer}` : customer ? `Wähle das Angebot, das ${customer} angenommen hat.` : "Wähle das Angebot, das der Kunde angenommen hat."}</p>
          </div>
          <button className="btn ghost sm" onClick={onClose} aria-label="Schließen">{I.close}</button>
        </header>

        {done ? (
          <div style={{ display:"grid", overflowY:"auto" }}>
            <div className="success">
              <span className="ok">{I.check}</span>
              <h3 style={{ fontSize:18 }}>Bestellung BE {done.no} angelegt</h3>
              <span style={{ color:"var(--muted)" }}>Aus AG {done.quoteId} für {done.customer}. Das Angebot ist jetzt gesperrt.</span>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap", justifyContent:"center" }}>
                <button className="btn border sm" onClick={onClose}>Schließen</button>
                <button className="btn primary sm" onClick={onClose}>Bestellung öffnen</button>
              </div>
            </div>
          </div>
        ) : (
          <div className={"d-body" + (sel ? " has-sel" : "")}>
            <OfferPicker {...{ q, setQ, customer, setCustomer, otherMatches, preset:presetCustomer, scope, setScope, sort, setSort, results, hidden, selectedId, searchRef }}
              onSelect={setSelectedId} onConfirm={() => firstFieldRef.current?.focus()} />
            {sel
              ? <OfferDetail key={sel.id} x={sel} form={form} setForm={setForm} ack={ack} setAck={setAck} onBack={() => setSelectedId(null)} firstFieldRef={firstFieldRef} />
              : <section className="detail"><div className="placeholder">
                  <strong>Noch kein Angebot ausgewählt</strong>
                  <span style={{ maxWidth:"42ch" }}>Links suchen und anklicken. Hier siehst du dann Positionen, Betrag und Gültigkeit zum Abgleich mit der Bestellung des Kunden.</span>
                  <span className="keys"><kbd>/</kbd> Suche · <kbd>↑</kbd><kbd>↓</kbd> durchblättern · <kbd>Enter</kbd> zu den Bestelldaten · <kbd>Esc</kbd> schließen</span>
                </div></section>}
          </div>
        )}

        {!done && (
          <footer className="d-foot">
            <span className="grow">
              {sel ? <>
                <span>AG {sel.quoteId} → BE {form.no || "…"}</span>
                <strong className="num" style={{ color:"var(--fg)" }}>{eur.format(monthly(sel))} / Monat</strong>
                {isExpired(sel) && !ack && <span style={{ color:"var(--warn)" }}>Abgelaufenes Angebot bestätigen</span>}
              </> : <span>Noch kein Angebot gewählt</span>}
            </span>
            <button className="btn border sm" onClick={onClose}>Abbrechen</button>
            <button className="btn primary sm" disabled={blocked} onClick={() => setDone({ no:form.no, quoteId:sel.quoteId, customer:sel.customer })}>Bestellung anlegen</button>
          </footer>
        )}
      </div>
    </div>
  );
}

// ── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [entry, setEntry] = useState("offers");
  const [entryCustomer, setEntryCustomer] = useState("Brandt Logistik GmbH");
  const [open, setOpen] = useState(true);
  const [n, setN] = useState(0);
  const preset = entry === "customer" ? entryCustomer : null;
  const reopen = () => { setN(k => k + 1); setOpen(true); };
  return (<>
    <div className="proto">
      <span className="tag">Prototyp</span>
      <span>Mock-Daten, nichts wird gespeichert.</span>
      <span style={{ display:"inline-flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>Geöffnet von:
        <span className="seg" role="group" aria-label="Einstieg">
          <button aria-pressed={entry === "offers"} onClick={() => { setEntry("offers"); reopen(); }}>Seite Angebote</button>
          <button aria-pressed={entry === "customer"} onClick={() => { setEntry("customer"); reopen(); }}>Kundenseite</button>
        </span>
        {entry === "customer" && <select id="entry-customer" className="select" value={entryCustomer} onChange={e => { setEntryCustomer(e.target.value); reopen(); }} aria-label="Kunde der Kundenseite">
          {CUSTOMERS.map(c => <option key={c}>{c}</option>)}
        </select>}
      </span>
      <span>Ideen zum Testen: „brandt m365“, „klinikum“, „0088“, „power bi“</span>
    </div>
    <div className="page">
      <div className="page-head">
        <h1>{entry === "customer" ? entryCustomer : "Angebote"}</h1>
        <button className="btn primary sm" onClick={reopen}>{I.plus} Bestellung anlegen</button>
      </div>
      <div className="ghostrows" aria-hidden="true"><div /><div /><div /><div /></div>
    </div>
    {open && <CreateOrderDialog key={n + entry + entryCustomer} presetCustomer={preset} onClose={() => setOpen(false)} />}
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
