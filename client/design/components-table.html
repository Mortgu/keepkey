<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Data Table" subtitle="Sortable customer table (asc/desc per column) — click a row to open a details drawer" viewport="1000x720" -->
<html lang="de">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #F7F8F7; color: #111A14; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  svg { display: block; }

  .page { padding: 28px; }
  .page h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  .page p.lead { font-size: 13px; color: #4B5C52; margin: 0 0 20px; }

  /* ── Table ─────────────────────────────────────────────────────── */
  .table-wrap { background: white; border: 1px solid #E0E4E1; border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; padding: 0; border-bottom: 1px solid #E0E4E1; background: #F7F8F7; }
  th button.sort-th {
    display: flex; align-items: center; gap: 5px; width: 100%; height: 100%;
    padding: 11px 16px; font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 600;
    color: #4B5C52; text-transform: uppercase; letter-spacing: 0.04em; background: none; border: none;
    cursor: pointer; text-align: left; transition: color 120ms;
  }
  th button.sort-th:hover { color: #111A14; }
  th.num button.sort-th { justify-content: flex-end; text-align: right; }
  th.no-sort { padding: 11px 16px; font-size: 11.5px; font-weight: 600; color: #4B5C52; text-transform: uppercase; letter-spacing: 0.04em; }

  .sort-icons { display: flex; flex-direction: column; gap: 1px; margin-left: 1px; flex-shrink: 0; }
  .sort-icons svg { width: 8px; height: 8px; color: #C4CFC8; transition: color 120ms; }
  th button.sort-th[data-dir="asc"] .sort-icons svg.up,
  th button.sort-th[data-dir="desc"] .sort-icons svg.down { color: #00683F; }

  tbody tr { border-bottom: 1px solid #F0F4F1; cursor: pointer; transition: background 100ms; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #F7F8F7; }
  tbody tr.active-row { background: #E6F2EC; }
  td { padding: 13px 16px; font-size: 13.5px; color: #111A14; vertical-align: middle; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.no-sort-cell { text-align: center; }

  .cust-name { font-weight: 600; }
  .cust-id { font-family: 'DM Mono', monospace; font-size: 11.5px; color: #8A9E93; margin-top: 1px; }
  .cust-cell { display: flex; flex-direction: column; gap: 1px; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%; background: #E6F2EC; color: #00683F;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
  .name-cell { display: flex; align-items: center; gap: 10px; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 9999px; font-size: 11px; font-weight: 500; }
  .badge-green { background: #E6F2EC; color: #00683F; }
  .badge-gray  { background: #F0F4F1; color: #4B5C52; }
  .badge-amber { background: #FEF3C7; color: #B45309; }

  .chev { color: #C4CFC8; flex-shrink: 0; }

  /* ── Drawer (shared pattern) ───────────────────────────────────── */
  .scrim { position: fixed; inset: 0; background: rgba(17,26,20,0.38); opacity: 0; pointer-events: none; transition: opacity 240ms ease; z-index: 40; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 92vw;
    background: white; box-shadow: -8px 0 24px rgba(0,0,0,0.12);
    display: flex; flex-direction: column; transform: translateX(100%);
    transition: transform 280ms cubic-bezier(0.32, 0.72, 0, 1); z-index: 50; will-change: transform;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid #E0E4E1; flex-shrink: 0; }
  .drawer-eyebrow { font-size: 11px; font-weight: 600; color: #00683F; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .drawer-title { font-size: 17px; font-weight: 600; color: #111A14; letter-spacing: -0.01em; line-height: 1.25; }
  .drawer-subtitle { font-size: 13px; color: #8A9E93; margin-top: 3px; }
  .drawer-close { background: none; border: none; cursor: pointer; color: #8A9E93; padding: 5px; border-radius: 5px; display: flex; flex-shrink: 0; margin: -3px -5px 0 0; }
  .drawer-close:hover { background: #F0F4F1; color: #111A14; }
  .drawer-body { padding: 20px 22px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 18px; }
  .drawer-footer { padding: 14px 22px; border-top: 1px solid #E0E4E1; background: #F7F8F7; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  button.btn-primary, button.btn-secondary, button.btn-ghost { font-family: 'DM Sans', sans-serif; font-weight: 500; border: none; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background 150ms, border-color 150ms, color 150ms; font-size: 13px; padding: 8px 16px; }
  .btn-primary { background: #00683F; color: white; }
  .btn-primary:hover { background: #005432; }
  .btn-secondary { background: white; color: #111A14; border: 1px solid #E0E4E1; }
  .btn-secondary:hover { background: #F7F8F7; border-color: #C4CFC8; }
  .btn-ghost { background: transparent; color: #00683F; padding: 8px 14px; }
  .btn-ghost:hover { background: #E6F2EC; }
  .footer-spacer { margin-left: auto; }
  .meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items: baseline; }
  .meta-grid dt { font-size: 12px; color: #8A9E93; }
  .meta-grid dd { font-size: 13px; color: #111A14; font-weight: 500; text-align: right; }
  .mono { font-family: 'DM Mono', monospace; }
  .group-label { font-size: 10px; font-weight: 600; color: #8A9E93; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
  .divider { height: 1px; background: #E0E4E1; margin: 2px 0; }
  .contact-list { display: flex; flex-direction: column; gap: 10px; }
  .contact-item { display: flex; align-items: center; gap: 10px; }
  .contact-name { font-size: 13.5px; font-weight: 500; }
  .contact-role { font-size: 12px; color: #8A9E93; }
</style>
</head>
<body>
  <div class="page">
    <h1>Kunden</h1>
    <p class="lead">Spaltenüberschriften anklicken zum Sortieren (auf­ / absteigend) · Zeile anklicken für Details.</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>
              <button class="sort-th" data-key="name" data-dir="asc">
                Kunde
                <span class="sort-icons">
                  <svg class="up" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,4 20,16 4,16"/></svg>
                  <svg class="down" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,20 4,8 20,8"/></svg>
                </span>
              </button>
            </th>
            <th>
              <button class="sort-th" data-key="ansprechpartner" data-dir="none">
                Ansprechpartner
                <span class="sort-icons">
                  <svg class="up" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,4 20,16 4,16"/></svg>
                  <svg class="down" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,20 4,8 20,8"/></svg>
                </span>
              </button>
            </th>
            <th class="no-sort">Status</th>
            <th class="num">
              <button class="sort-th" data-key="orders" data-dir="none">
                Bestellungen
                <span class="sort-icons">
                  <svg class="up" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,4 20,16 4,16"/></svg>
                  <svg class="down" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,20 4,8 20,8"/></svg>
                </span>
              </button>
            </th>
            <th class="num">
              <button class="sort-th" data-key="umsatz" data-dir="none">
                Umsatz
                <span class="sort-icons">
                  <svg class="up" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,4 20,16 4,16"/></svg>
                  <svg class="down" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,20 4,8 20,8"/></svg>
                </span>
              </button>
            </th>
            <th>
              <button class="sort-th" data-key="date" data-dir="desc">
                Erstellt
                <span class="sort-icons">
                  <svg class="up" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,4 20,16 4,16"/></svg>
                  <svg class="down" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,20 4,8 20,8"/></svg>
                </span>
              </button>
            </th>
            <th class="no-sort" style="width:36px"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="drawer-header">
      <div>
        <div class="drawer-eyebrow" id="d-eyebrow">Kunde</div>
        <div class="drawer-title" id="d-title">—</div>
        <div class="drawer-subtitle" id="d-subtitle">—</div>
      </div>
      <button class="drawer-close" data-close aria-label="Schließen">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <dl class="meta-grid">
        <dt>Kunden-Nr.</dt><dd class="mono" id="d-id">—</dd>
        <dt>Status</dt><dd id="d-status">—</dd>
        <dt>Bestellungen</dt><dd id="d-orders">—</dd>
        <dt>Umsatz</dt><dd id="d-umsatz">—</dd>
        <dt>Erstellt</dt><dd id="d-date">—</dd>
      </dl>
      <div class="divider"></div>
      <div>
        <div class="group-label" style="margin-bottom:10px">Ansprechpartner</div>
        <div class="contact-list" id="d-contacts"></div>
      </div>
    </div>
    <div class="drawer-footer">
      <button class="btn-ghost" data-close>Schließen</button>
      <button class="btn-primary footer-spacer">Kunde öffnen</button>
    </div>
  </aside>

<script>
  var customers = [
    { id:'C-1001', name:'Musterfirma GmbH',      contacts:[{name:'Sarah Kessler', role:'Einkauf'}],                     status:'aktiv',   orders:1,  umsatz:12450, date:'2026-07-15' },
    { id:'C-1002', name:'Beispiel AG',           contacts:[],                                                          status:'aktiv',   orders:0,  umsatz:0,     date:'2026-07-15' },
    { id:'C-1003', name:'dwad',                  contacts:[],                                                          status:'neu',     orders:0,  umsatz:0,     date:'2026-07-29' },
    { id:'C-1004', name:'Bahlsen GmbH',          contacts:[{name:'Michael Otto', role:'Ansprechpartner'}],             status:'aktiv',   orders:8,  umsatz:64200, date:'2026-06-02' },
    { id:'C-1005', name:'Ferrero Deutschland',   contacts:[{name:'Julia Nowak', role:'Einkaufsleitung'}, {name:'Tom Reiter', role:'Buchhaltung'}], status:'aktiv', orders:14, umsatz:112800, date:'2026-04-21' },
    { id:'C-1006', name:'Katjes International',  contacts:[{name:'Anna Berg', role:'Ansprechpartner'}],                status:'inaktiv',orders:3,  umsatz:9750,  date:'2025-11-08' },
  ];

  var state = { key:'date', dir:'desc' };

  function fmtEUR(n){ return n.toLocaleString('de-DE',{minimumFractionDigits:0}) + ' €'; }
  function fmtDate(s){ var d=new Date(s); return d.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}); }
  function initials(name){ return name.split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase();}).join(''); }
  function statusBadge(s){
    if (s==='aktiv') return '<span class="badge badge-green">Aktiv</span>';
    if (s==='neu') return '<span class="badge badge-amber">Neu</span>';
    return '<span class="badge badge-gray">Inaktiv</span>';
  }

  function sortedRows(){
    var rows = customers.slice();
    var key = state.key, dir = state.dir;
    if (dir === 'none') return rows;
    rows.sort(function(a,b){
      var av = a[key], bv = b[key];
      if (key === 'name') { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
      if (key === 'date') { av = new Date(a.date).getTime(); bv = new Date(b.date).getTime(); }
      if (av < bv) return dir==='asc' ? -1 : 1;
      if (av > bv) return dir==='asc' ? 1 : -1;
      return 0;
    });
    return rows;
  }

  function render(){
    var tbody = document.getElementById('tbody');
    tbody.innerHTML = sortedRows().map(function(c){
      return '<tr data-id="'+c.id+'">'
        + '<td><div class="name-cell"><span class="avatar">'+initials(c.name)+'</span><div class="cust-cell"><span class="cust-name">'+c.name+'</span><span class="cust-id">'+c.id+'</span></div></div></td>'
        + '<td>'+(c.contacts.length ? c.contacts[0].name + (c.contacts.length>1 ? ' <span style="color:#8A9E93">+'+(c.contacts.length-1)+'</span>' : '') : '<span style="color:#C4CFC8">—</span>')+'</td>'
        + '<td>'+statusBadge(c.status)+'</td>'
        + '<td class="num">'+c.orders+'</td>'
        + '<td class="num">'+(c.umsatz ? fmtEUR(c.umsatz) : '<span style="color:#C4CFC8">—</span>')+'</td>'
        + '<td>'+fmtDate(c.date)+'</td>'
        + '<td class="no-sort-cell"><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></td>'
        + '</tr>';
    }).join('');

    Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr){
      tr.addEventListener('click', function(){ openDrawer(tr.getAttribute('data-id')); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.sort-th'), function(btn){
      btn.setAttribute('data-dir', btn.getAttribute('data-key')===state.key ? state.dir : 'none');
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.sort-th'), function(btn){
    btn.addEventListener('click', function(){
      var key = btn.getAttribute('data-key');
      if (state.key === key) {
        state.dir = state.dir==='asc' ? 'desc' : (state.dir==='desc' ? 'none' : 'asc');
        if (state.dir === 'none') state.key = null;
      } else {
        state.key = key; state.dir = 'asc';
      }
      render();
    });
  });

  var scrim = document.getElementById('scrim'), drawer = document.getElementById('drawer'), activeRow = null;

  function openDrawer(id){
    var c = customers.filter(function(x){ return x.id===id; })[0];
    if (!c) return;
    document.getElementById('d-title').textContent = c.name;
    document.getElementById('d-subtitle').textContent = c.contacts.length ? c.contacts.length + ' Ansprechpartner' : 'Keine Ansprechpartner hinterlegt';
    document.getElementById('d-id').textContent = c.id;
    document.getElementById('d-status').innerHTML = statusBadge(c.status);
    document.getElementById('d-orders').textContent = c.orders;
    document.getElementById('d-umsatz').textContent = c.umsatz ? fmtEUR(c.umsatz) : '—';
    document.getElementById('d-date').textContent = fmtDate(c.date);
    document.getElementById('d-contacts').innerHTML = c.contacts.length ? c.contacts.map(function(p){
      return '<div class="contact-item"><span class="avatar" style="width:26px;height:26px;font-size:10.5px">'+initials(p.name)+'</span><div><div class="contact-name">'+p.name+'</div><div class="contact-role">'+p.role+'</div></div></div>';
    }).join('') : '<span style="font-size:13px;color:#8A9E93">Keine Ansprechpartner hinterlegt.</span>';

    if (activeRow) activeRow.classList.remove('active-row');
    activeRow = document.querySelector('tr[data-id="'+id+'"]');
    if (activeRow) activeRow.classList.add('active-row');

    scrim.classList.add('open'); drawer.classList.add('open');
  }
  function closeDrawer(){
    scrim.classList.remove('open'); drawer.classList.remove('open');
    if (activeRow) { activeRow.classList.remove('active-row'); activeRow = null; }
  }
  scrim.addEventListener('click', closeDrawer);
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function(b){ b.addEventListener('click', closeDrawer); });
  document.addEventListener('keydown', function(e){ if (e.key==='Escape') closeDrawer(); });

  render();
</script>
</body>
</html>
