name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Echte Postgres-Instanz für die Annahme-/Locking-Tests (order-postgres.test.ts)
      # und den Migrations-Drift-Check. Die Tests legen je Lauf ein eigenes Schema an.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keepit
          POSTGRES_PASSWORD: keepit
          POSTGRES_DB: keepit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keepit -d keepit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://keepit:keepit@localhost:5432/keepit_test
      ORDER_TEST_DATABASE_URL: postgresql://keepit:keepit@localhost:5432/keepit_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Client und Server konsumieren shared/dist; der Prisma-Client muss vor tsc existieren.
      - name: Prepare
        id: prepare
        run: |
          pnpm --filter @keepit/schemas build
          pnpm --filter server exec prisma generate

      # Ab hier laufen alle Checks unabhängig voneinander, damit ein roter Lint nicht
      # Tests und Build verdeckt. --no-bail lässt jedes Paket seine Fehler melden.
      - name: Typecheck
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm -r --no-bail --if-present typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm -r --no-bail lint

      # Schema-Änderungen ohne Migration fallen hier auf (db push ist nicht erlaubt).
      - name: Migrations match schema
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: server
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

      - name: Tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm -r --no-bail test

      - name: Build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: pnpm -r --filter '!@keepit/schemas' build
